[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/hocinehacherouf/liberarr"

[workspace.dependencies]
liberarr-core = { path = "crates/liberarr-core" }
liberarr-infra = { path = "crates/liberarr-infra" }
liberarr-web = { path = "crates/liberarr-web" }
clap = { version = "=4.6.7", features = ["derive", "string"] }
rust-embed = { version = "=8.13.0", features = ["mime-guess"] }
jiff = "=0.2.41"
thiserror = "=2.0.21"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rsa = { version = "=0.10.0", features = ["pkcs1v15"] }
chacha20poly1305 = "=0.11.0"
chacha20 = "=0.10.2"
rand_chacha = "=0.10.0"
sha2 = "=0.11.1"
rusqlite = { version = "=0.42.0", features = ["bundled"] }
tokio = "=1.54.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "multipart"] }
axum = "=0.8.9"
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.7.1", default-features = false, features = ["fs"] }
subtle = "=2.6.1"
btleplug = "=0.13.5"
# Opus decoding; the default `bundled` feature of opusic-sys builds libopus from source (needs cmake).
opus = "=0.4.0"
# Local transcription (whisper.cpp built from the bundled sources, needs cmake and a C++ compiler). The `metal`
# feature is added for Apple silicon in liberarr-infra. whisper-rs-sys forwards GGML_*, WHISPER_* and CMAKE_*
# environment variables to cmake, so CI sets GGML_NATIVE=OFF.
whisper-rs = { version = "=0.16.0", default-features = false }
# Local speaker diarization: the -sys build script downloads a prebuilt static onnxruntime archive without any
# checksum. CI and release builds fetch and verify it first (packaging/fetch-sherpa-onnx.sh) and set
# SHERPA_ONNX_ARCHIVE_DIR. A bump needs the hashes in packaging/sherpa-onnx.sha256 updated.
sherpa-onnx = "=2.0.1"
futures = "=0.3.34"
base64 = "=0.23.1"
hkdf = "=0.13.0"
hmac = "=0.13.0"
aes = "=0.9.4"
cbc = { version = "=0.2.1", features = ["alloc"] }
getrandom = "=0.4.3"
rpassword = "=7.5.4"
rust-i18n = "=4.2.4"
# `unstable-rendered-line-info`: the wrapped line count, for the scrollbars of the terminal app.
ratatui = { version = "=0.30.2", features = ["unstable-rendered-line-info"] }
tachyonfx = { version = "=0.25.2", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.release]
lto = true
strip = true
opt-level = "z"
codegen-units = 1
