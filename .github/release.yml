# Groups the generated release notes by pull request label. Breaking changes come first.
changelog:
  categories:
    - title: Breaking changes
      labels: ["breaking change"]
    - title: New
      labels: ["enhancement"]
    - title: Fixes
      labels: ["bug", "security"]
    - title: Documentation
      labels: ["documentation"]
    - title: Dependencies
      labels: ["dependencies"]
    - title: Other changes
      labels: ["*"]
