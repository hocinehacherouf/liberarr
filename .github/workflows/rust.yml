name: Rust

on:
  push:
    branches: [main]
  # No path filter: the job is a required check, and a required check that never runs blocks the PR.
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-26.04
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          # A new host fails the job: the run insights (link in this step's log) show the blocked call.
          # rustup (also inside cargo-deny), cargo, apt-get update (its hooks call esm/motd), cargo-deny's
          # advisory database (github.com). ec2 mirror: the apt mirror of the runner's AWS region.
          # release-assets.githubusercontent.com: where GitHub redirects release downloads (the sherpa-onnx
          # archive, fetched by one step below; no build script may download anything).
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            release-assets.githubusercontent.com:443
            static.rust-lang.org:443
            index.crates.io:443
            static.crates.io:443
            azure.archive.ubuntu.com:80
            *.ec2.archive.ubuntu.com:80
            security.ubuntu.com:80
            packages.microsoft.com:443
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            results-receiver.actions.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # liberarr-web embeds web/dist/index.html at compile time and its SPA test only checks for `<html`;
      # web.yml and release.yml build the real UI.
      - name: Create a placeholder web UI
        run: mkdir -p web/dist && echo '<!doctype html><html></html>' > web/dist/index.html
      - name: Install the Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - name: Install the BlueZ client headers (btleplug on Linux), cmake (libopus, whisper.cpp) and libclang (whisper-rs bindings)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config cmake libclang-dev
      # The build script of sherpa-onnx-sys would download this archive unchecked. Fetch and verify it here
      # (it exports SHERPA_ONNX_ARCHIVE_DIR). Never cache target/ in a workflow: that build script reuses
      # target/sherpa-onnx-prebuilt/ without any check.
      - name: Fetch the sherpa-onnx archive (checked against packaging/sherpa-onnx.sha256)
        run: packaging/fetch-sherpa-onnx.sh linux-x64 "$RUNNER_TEMP/sherpa"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The fuzz targets live in their own workspace: build them so a core API change cannot break them unseen.
      # No --locked: Renovate bumps core's exact pins in the root lock only, so fuzz/Cargo.lock may lag.
      - name: Check the fuzz targets
        run: |
          cargo fmt --manifest-path fuzz/Cargo.toml --check
          cargo clippy --manifest-path fuzz/Cargo.toml -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses sources
