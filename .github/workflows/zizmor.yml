name: zizmor

on:
  push:
    branches: [main]
  # No path filter: the job is a required check, and a required check that never runs blocks the PR.
  pull_request:

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.31.1
          # No SARIF upload: findings fail this required check, also on fork PRs (read-only token).
          advanced-security: false
