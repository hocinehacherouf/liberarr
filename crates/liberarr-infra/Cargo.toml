[package]
name = "liberarr-infra"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
liberarr-core = { workspace = true }
jiff = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
# spawn_blocking for the synchronous SQLite adapters (core stays runtime-free).
tokio = { workspace = true, features = ["rt", "time"] }
# rustls only: no OpenSSL on the host.
reqwest = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }

# BLE transport (BlueZ on Linux, CoreBluetooth on macOS).
btleplug = { workspace = true }
futures = { workspace = true }
# Unlock secret: parses the user's private key.
rsa = { workspace = true }

# Key store: XChaCha20-Poly1305 under an HKDF-derived key.
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }

# Fernet (Plaud cloud replies) by hand: AES-128-CBC + HMAC-SHA256, no OpenSSL.
aes = { workspace = true }
cbc = { workspace = true }
hmac = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "time"] }
# In-process mock provider for the AI client tests.
axum = { workspace = true }
