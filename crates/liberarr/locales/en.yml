# `--help`. Option texts may use %{default} and %{values} (from the clap definition).
help.usage: "Usage:"
help.commands: "Commands"
help.command: "COMMAND"
help.arguments: "Arguments"
help.options: "Options"
help.help: "Print help"
help.version: "Print version"
help.about: "Free your Plaud recordings: transcript, summary and visuals, with any AI provider. Docs: docs/ in the repository."
help.init.about: "Create the home folder and its .env (generated secrets, AI provider keys). Values already set are kept."
help.init.non_interactive: "Ask nothing: read LIBERARR_{TRANSCRIBE,LLM}_{PROVIDER,BASE_URL,API_KEY,MODEL} from the environment (keys never go on the command line) and fail if one is missing (all the transcription ones may be left out: it runs locally; all the summary ones may be left out too: no summary, or LIBERARR_LLM_PROVIDER=none)"
help.init.ui: "Question style: plain (one question per line) or tui (full-screen). Default: LIBERARR_UI, else plain. Values: %{values}"
help.link.about: "Fetch the device keys from your Plaud account once (token pasted, never stored), then test an unlock"
help.link.force: "Fetch a new key pair even if one is stored"
help.pull.about: "Pull new recordings from the device over Bluetooth, then process them. Wake the device and close the Plaud app first."
help.pull.no_process: "Only pull: do not transcribe, summarize or export"
help.process.about: "Run the pipeline (transcription, summary, export) on local audio files"
help.process.files: "Audio files to import; one already imported is not duplicated"
help.rerun.about: "Queue a step of a recording again: the failed one, or --step. It runs in serve, tui or the next pull or process; prior outputs are kept until the step succeeds."
help.rerun.id: "Recording number (#id), as shown by process, the web UI or the terminal app"
help.rerun.step: "Step to run again (and the steps after it). Values: %{values}"
help.serve.about: "Start the web UI and API, with the job worker. Never talks to the device."
help.serve.host: "Address to listen on; 0.0.0.0 exposes the UI on the network. Default: %{default}"
help.serve.port: "Port to listen on. Default: %{default}"
help.mcp.about: "Serve your recordings read-only to an AI agent (MCP over standard input and output). Your agent starts this command; what it reads goes to its AI provider."
help.status.about: "Show the known devices, the last pull and queued or failed work"
help.tui.about: "Full-screen terminal app: recordings, transcripts, summaries, pipeline, device pull, settings. Starts with the setup when there is no configuration yet."
help.backup.about: "Copy the home to a new folder, consistent even while serve, tui or pull run. The .env is left out. Restore: copy the folder back as LIBERARR_HOME, then add the .env."
help.backup.dest: "New or empty folder, outside the home"
